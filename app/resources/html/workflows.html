<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>知汇 · 流程监控</title>
  <link rel="stylesheet" href="/static/app.css?v={{ASSET_V}}">
  <link rel="stylesheet" href="/static/workflows.css?v={{ASSET_V}}">
</head>
<body>
  <main class="workflow-page">
    <header class="workflow-header">
      <div class="brand">
        <div class="logo" aria-hidden="true">知</div>
        <div class="title"><strong>知汇</strong><span>流程监控</span></div>
      </div>
      <nav class="workflow-nav" aria-label="业务页面">
        <a href="/">返回对话</a>
        <a href="/approval">自进化审批</a>
      </nav>
    </header>

    <div class="workflow-heading">
      <h1>流程监控</h1>
      <p id="workflowConnection" class="workflow-connection" role="status" data-state="idle">等待连接</p>
    </div>
    <nav id="workflowViews" class="workflow-views" aria-label="流程类型">
      <button type="button" data-view="import" aria-pressed="false">文件导入</button>
      <button type="button" data-view="query" aria-pressed="false">问答</button>
      <button type="button" data-view="evolution-cycle" aria-pressed="false">调度轮次</button>
      <button type="button" data-view="evolution-candidate" aria-pressed="false">候选生命周期</button>
    </nav>
    <form id="workflowAuth" class="workflow-auth" hidden>
      <label id="workflowTokenLabel" for="workflowToken">管理令牌</label>
      <input type="password" id="workflowToken" autocomplete="off" required>
      <button class="btn" type="submit">连接</button>
    </form>

    <div class="workflow-workspace">
      <section class="workflow-runs workflow-panel" aria-labelledby="runsHeading">
        <div class="workflow-panel-title"><h2 id="runsHeading">运行记录</h2><span id="workflowCount"></span></div>
        <p id="workflowEmpty" class="workflow-empty">暂无运行记录</p>
        <div id="workflowRuns" class="workflow-run-list"></div>
      </section>
      <section class="workflow-main workflow-panel" aria-labelledby="graphHeading">
        <div class="workflow-graph-header">
          <div class="workflow-graph-title">
            <h2 id="graphHeading">流程图</h2>
            <p id="workflowRunInfo" class="workflow-run-info" hidden></p>
          </div>
          <span class="workflow-status" id="workflowRunStatus" hidden></span>
        </div>
        <p id="workflowNotice" class="workflow-notice" role="status" hidden></p>
        <div class="workflow-legend" aria-label="节点状态" id="workflowLegend" hidden>
          <span class="workflow-status" data-state="running"><i aria-hidden="true">●</i>运行中</span>
          <span class="workflow-status" data-state="completed"><i aria-hidden="true">✓</i>已完成</span>
          <span class="workflow-status" data-state="idle"><i aria-hidden="true">○</i>未执行</span>
          <span class="workflow-status" data-state="failed"><i aria-hidden="true">!</i>失败</span>
        </div>
        <div id="workflowDiagram" class="workflow-diagram" hidden>
          <canvas id="workflowEdges" class="workflow-edges" aria-hidden="true"></canvas>
          <div id="workflowNodes" class="workflow-nodes"></div>
          <ul id="workflowEdgeList" class="workflow-sr-only" aria-label="节点连接"></ul>
        </div>
      </section>
    </div>
  </main>
  <script src="/static/app.js?v={{ASSET_V}}"></script>
  <script src="/static/workflows.js?v={{ASSET_V}}"></script>
</body>
</html>
