<!-- 自进化候选审批后台：状态筛选 + 人工编辑 + 通过/驳回（写操作需 X-Internal-Token）。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>自进化候选审批 · 掌柜智库</title>
  <link rel="stylesheet" href="/static/app.css?v={{ASSET_V}}" />
  <link rel="stylesheet" href="/static/approval.css?v={{ASSET_V}}" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <strong>自进化候选审批</strong>
          <span>闭环 · 候选 → 审批 → 入库</span>
        </div>
      </div>
      <div class="filters">
        <select id="statusFilter">
          <option value="">全部状态</option>
          <option value="draft">待审批（draft）</option>
          <option value="need_info">待人工补充（need_info）</option>
          <option value="candidate">强缺口（candidate）</option>
          <option value="pending">弱缺口（pending）</option>
          <option value="active">已入库（active）</option>
          <option value="rejected">已驳回（rejected）</option>
          <option value="hold">观察中（hold）</option>
        </select>
        <span class="count" id="count">—</span>
        <span class="pill" id="evoStatus" title="自进化闭环运行状态">闭环状态：—</span>
        <span class="tok">
          管理Token
          <input id="adminToken" type="password" autocomplete="off" placeholder="EVOLUTION_ADMIN_TOKEN">
        </span>
        <button class="btn" id="refresh">刷新</button>
      </div>
    </div>
    <div class="greet">说明：待审候选（draft）可「通过」（写入知识库并置为 active）、「驳回」（置为 rejected）或先「编辑」内容再审批。</div>
    <div id="list"></div>
  </div>

  <script src="/static/app.js?v={{ASSET_V}}"></script>
  <script src="/static/approval.js?v={{ASSET_V}}"></script>
</body>
</html>
