<!-- 自进化候选审批后台页面：查询 /api/evolution/candidates，支持按状态筛选、审批通过/驳回/编辑。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>自进化候选审批 · 掌柜智库</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    /* 本页布局：审批列表卡片（视觉基础样式见 /static/app.css） */
    body{
      margin:0;
      min-height:100vh;
      padding:24px;
    }
    .app{
      max-width:1060px;
      margin:0 auto;
    }
    .topbar{
      display:flex;align-items:center;gap:14px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px 18px;
      box-shadow:var(--shadow);
      flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:220px}
    .logo{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      box-shadow:0 8px 18px rgba(26,167,255,.25);
    }
    .title strong{font-size:15px;display:block;line-height:1.2}
    .title span{font-size:12px;color:var(--muted)}
    .filters{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .count{font-size:12px;color:var(--muted)}
    .card{
      background:var(--panel);border:1px solid var(--border);border-radius:14px;
      padding:16px 18px;margin-top:14px;box-shadow:0 6px 18px rgba(31,45,61,.06);
    }
    .greet{font-size:12px;color:var(--muted);margin-top:10px}
    .item{
      background:var(--panel);border:1px solid var(--border);border-radius:14px;
      margin-top:14px;padding:16px 18px;box-shadow:0 6px 18px rgba(31,45,61,.06);
    }
    .item-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .st{font-size:11px;line-height:1;padding:4px 8px;border-radius:8px;color:#fff}
    .st.draft{background:#f2a33c}
    .st.active{background:var(--ok)}
    .st.rejected{background:var(--danger)}
    .st.candidate{background:var(--brand2)}
    .st.pending{background:#8aa0b4}
    .st.hold{background:#b068d0}
    .st.removed{background:#9aa6b2}
    .item-id{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
    .item-ts{margin-left:auto;font-size:11px;color:var(--muted)}
    .q{font-size:15px;font-weight:600;margin:10px 0 4px}
    .a{font-size:13px;color:#3b4a5a;line-height:1.55;white-space:pre-wrap;background:rgba(91,124,250,.05);border-left:3px solid rgba(91,124,250,.35);padding:8px 12px;border-radius:0 8px 8px 0}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .ops{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .edit-box{margin-top:12px;border-top:1px dashed var(--border);padding-top:12px}
    .edit-box label{display:block;font-size:12px;color:var(--muted);margin:6px 0 4px}
    .edit-box textarea{
      width:100%;border:1px solid var(--border);border-radius:9px;padding:8px 10px;
      font-size:13px;line-height:1.5;resize:vertical;font-family:inherit;outline:none;
    }
    .edit-box textarea:focus{border-color:rgba(26,167,255,.6);box-shadow:0 0 0 3px rgba(26,167,255,.12)}
    .tok{
      display:flex;align-items:center;gap:6px;
      font-size:12px;color:var(--muted);
    }
    .tok input{
      border:1px solid var(--border);border-radius:8px;
      padding:7px 10px;font-size:12px;width:150px;outline:none;
      background:#fff;color:var(--text);font-family:ui-monospace,Menlo,monospace;
    }
    .tok input:focus{border-color:rgba(26,167,255,.6)}
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <strong>自进化候选审批</strong>
          <span>M1 闭环 · 候选 → 审批 → 入库</span>
        </div>
      </div>
      <div class="filters">
        <select id="statusFilter">
          <option value="">全部状态</option>
          <option value="draft">待审批（draft）</option>
          <option value="candidate">强缺口（candidate）</option>
          <option value="pending">弱缺口（pending）</option>
          <option value="active">已入库（active）</option>
          <option value="rejected">已驳回（rejected）</option>
          <option value="hold">观察中（hold）</option>
        </select>
        <span class="count" id="count">—</span>
        <span class="tok">
          管理Token
          <input id="adminToken" type="password" autocomplete="off" placeholder="EVOLUTION_ADMIN_TOKEN">
        </span>
        <button class="btn" id="refresh">刷新</button>
      </div>
    </div>
    <div class="greet">说明：待审候选（draft）可「通过」（写入知识库并置为 active）、「驳回」（置为 rejected）或先「编辑」内容再审批。强缺口 candidate 经生成器会自动转 draft。</div>
    <div id="list"></div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    App.configure({ fallbackPort: 8001 });
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');
    const filterEl = document.getElementById('statusFilter');
    const tokenEl = document.getElementById('adminToken');

    // 审批写操作令牌：仅当前标签页会话有效（sessionStorage），输入时即时持久化
    let adminToken = App.getAdminToken();
    if(tokenEl){
      tokenEl.value = adminToken;
      tokenEl.addEventListener('input', () => {
        adminToken = tokenEl.value.trim();
        App.setAdminToken(adminToken);
      });
    }

    // 页面内短名，统一指向公共库实现
    const toast = App.toast;
    const esc = App.escapeHtml;
    function shortId(id){ return String(id||'').slice(0,8); }
    const fmtTs = App.formatDateTime;
    const ST_LABEL = {draft:'待审批', candidate:'强缺口', pending:'弱缺口', active:'已入库', rejected:'已驳回', hold:'观察中', removed:'已下架'};

    async function api(url, opts){
      // 公共库会自动携带 X-Internal-Token（读取自 sessionStorage）并统一解析错误
      return await App.fetchJson(url, opts || {});
    }

    function beginEdit(item, card){
      if(card.querySelector('.edit-box')) return; // 防重入：编辑框已存在则忽略
      const box = document.createElement('div');
      box.className = 'edit-box';
      box.innerHTML =
        '<label>问题（faq_question）</label>' +
        '<textarea rows="2" data-k="q">' + esc(item.faq_question) + '</textarea>' +
        '<label>答案（faq_answer）</label>' +
        '<textarea rows="4" data-k="a">' + esc(item.faq_answer) + '</textarea>' +
        '<div class="ops">' +
        '  <button class="btn" data-act="save">保存</button>' +
        '  <button class="btn plain" data-act="cancel">取消</button>' +
        '</div>';
      box.querySelector('[data-act=save]').addEventListener('click', async () => {
        const q = box.querySelector('[data-k=q]').value.trim();
        const a = box.querySelector('[data-k=a]').value.trim();
        if(!q && !a){ toast('无改动'); return; }
        try{
          await api(App.PATHS.candidateAction(item.id, 'edit'), {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({faq_question:q || null, faq_answer:a || null})
          });
          toast('已保存，重新加载');
          reload();
        }catch(e){ toast('编辑失败：' + e.message); }
      });
      box.querySelector('[data-act=cancel]').addEventListener('click', () => {
        reload();
      });
      card.querySelector('.ops').after(box);
      box.querySelector('[data-k=q]').focus();
    }

    function render(items){
      listEl.innerHTML = '';
      countEl.textContent = items.length + ' 条';
      if(items.length === 0){
        listEl.innerHTML = '<div class="empty">暂无候选数据（可切换上方状态筛选）</div>';
        return;
      }
      for(const it of items){
        const card = document.createElement('div');
        card.className = 'item';
        const st = ST_LABEL[it.status] || it.status;
        card.innerHTML =
          '<div class="item-head">' +
          '  <span class="st ' + esc(it.status) + '">' + esc(st) + '</span>' +
          '  <span class="item-id">#' + esc(shortId(it.id)) + '</span>' +
          '  <span class="item-ts">' + esc(fmtTs(it.ts)) + '</span>' +
          '</div>' +
          '<div class="q">' + esc(it.faq_question) + '</div>' +
          '<div class="a">' + esc(it.faq_answer) + '</div>' +
          '<div class="chips">' +
            (Array.isArray(it.item_names) && it.item_names.length
              ? it.item_names.map(n => '<span class="chip">主体:' + esc(n) + '</span>').join('')
              : '<span class="chip">无主体</span>') +
            (Array.isArray(it.source_refs) && it.source_refs.length
              ? it.source_refs.map(s => '<span class="chip">ref:' + esc(String(s).slice(0,40)) + '</span>').join('')
              : '') +
          '</div>' +
          '<div class="ops"></div>';

        const ops = card.querySelector('.ops');
        const actBtn = (label, cls, fn) => {
          const b = document.createElement('button');
          b.className = 'btn ' + cls;
          b.textContent = label;
          b.addEventListener('click', () => fn(b));
          ops.appendChild(b);
          return b;
        };

        if(it.status === 'draft'){
          actBtn('✔ 通过', 'good', async (b) => {
            b.disabled = true;
            try{
              await api(App.PATHS.candidateAction(it.id, 'approve'), {
                method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({reason:''})
              });
              toast('已审批通过并入知识库');
              reload();
            }catch(e){ b.disabled = false; toast('通过失败：' + e.message); }
          });
          actBtn('✕ 驳回', 'bad', async (b) => {
            if(!(await App.confirm('确认驳回该候选？', { confirmText: '确认驳回', danger: true }))) return;
            b.disabled = true;
            try{
              await api(App.PATHS.candidateAction(it.id, 'reject'), {
                method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({reason:''})
              });
              toast('已驳回');
              reload();
            }catch(e){ b.disabled = false; toast('驳回失败：' + e.message); }
          });
          actBtn('✎ 编辑', 'plain', () => beginEdit(it, card));
        } else if(it.status === 'active'){
          ops.innerHTML = '<span class="greet" style="margin:0">已写入知识库（active）</span>';
        } else if(it.status === 'rejected'){
          ops.innerHTML = '<span class="greet" style="margin:0">已驳回（rejected）</span>';
        } else {
          ops.innerHTML = '<button class="btn plain" data-relaunch="1">该状态无需审批操作</button>';
        }
        listEl.appendChild(card);
      }
    }

    async function reload(){
      const status = filterEl.value || undefined;
      const qs = status ? ('?status=' + encodeURIComponent(status)) : '';
      try{
        const data = await api(App.PATHS.candidates + qs);
        render(Array.isArray(data.items) ? data.items : []);
      }catch(e){
        listEl.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
        countEl.textContent = '—';
      }
    }

    filterEl.addEventListener('change', reload);
    document.getElementById('refresh').addEventListener('click', reload);
    reload();
  </script>
</body>
</html>
