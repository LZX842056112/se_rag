<!-- 文件导入页：拖拽/点选上传（仅 md / pdf），并实时展示解析节点进度。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>知识库文件导入</title>
  <link rel="stylesheet" href="/static/app.css?v={{ASSET_V}}" />
  <link rel="stylesheet" href="/static/import.css?v={{ASSET_V}}" />
</head>
<body>
  <div class="page narrow" style="width:100%;">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <strong>知识库文件导入</strong>
          <span>支持 Markdown / PDF，解析后自动切分、识别主体并写入向量库</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill">仅支持 md / pdf</span>
      </div>
    </div>

    <div class="panel">
      <div class="upload-area" id="dropZone">
        <div class="upload-icon">☁️</div>
        <p class="upload-hint">点击或拖拽文件到此处（PDF / MD）</p>
        <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md">
      </div>

      <div id="fileList" class="file-list">
        <!-- 文件列表由 /static/import.js 生成 -->
      </div>
    </div>
  </div>

  <script src="/static/app.js?v={{ASSET_V}}"></script>
  <script src="/static/import.js?v={{ASSET_V}}"></script>
</body>
</html>
