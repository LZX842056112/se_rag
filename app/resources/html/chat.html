<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="/static/app.css" />
  <style>
    /* 本页布局：整屏居中 + 固定高度对话面板（视觉基础样式见 /static/app.css） */

      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
    }
    .app{
      width:100%;
      max-width:980px;
      height:min(820px, 92vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .topbar{

      align-items:center;

      padding:14px 18px;

      background:linear-gradient(90deg, rgba(26,167,255,.10), rgba(91,124,250,.10));

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:240px;
    }
    .logo{
      width:36px;height:36px;border-radius:10px;

    .title{

      flex-direction:column;

    .title strong{font-size:14px}
    .title span{font-size:12px;color:var(--muted);margin-top:3px}
    .top-actions{

      display:flex;
      gap:10px;
      align-items:center;
    }

      flex:1;
      overflow:auto;
      padding:16px 14px 10px;
      background:linear-gradient(180deg, rgba(26,167,255,.05), transparent 40%),

    .dayline{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:6px 0 14px;

    .msg{
      display:flex;
      gap:10px;

    .msg.user{justify-content:flex-end}
    /* 关键：只让“消息内容容器”(排除头像)在 flex 中可伸缩，避免被压到“1 个字宽”导致竖排换行 */

      border-radius:14px;
      padding:10px 12px;
      border:1px solid var(--border);
      background:var(--bubble-bot);

      line-height:1.55;
      font-size:14px;
      white-space:pre-wrap;

    .msg.user .bubble{
      background:var(--bubble-user);

      border-color:transparent;
    }
    .meta{
      font-size:11px;

      gap:8px;
      font-size:12px;
      color:var(--muted);
      margin-top:8px;
    }
    .gauge{
      flex:1;
      height:6px;
      border-radius:99px;
      background:#e9eef7;

    }
    .gauge > i{
      display:block;
      height:100%;
      border-radius:99px;
      background:linear-gradient(90deg, var(--brand), var(--brand2));
    }
    .feedback-bar{
      display:flex;
      align-items:center;
      gap:8px;

    }
    .fb-btn{
      border:1px solid var(--border);

    .typing{

    .composer{

    textarea{

  <script src="/static/app.js"></script>
  <script>
    // 默认走查询服务同源地址；如你把页面单独打开（file://），回退到查询服务默认端口。
    // 初始化接口基地址（同源部署时即当前源；单独打开页面时回退到 8001）
    App.configure({ fallbackPort: 8001 });
    // 公共库的格式化 / 转义 / 提示（页面内不再重复实现）
    const escapeHtml = App.escapeHtml;
    const nowTime = () => App.formatTime(null);
    const formatTime = App.formatTime;
    const showToast = App.toast;
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    // Session ID Logic
    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    let __scrollRaf = 0;
    function scrollToBottom(){
      if (__scrollRaf) return;
      __scrollRaf = requestAnimationFrame(() => {
        __scrollRaf = 0;
        chatEl.scrollTop = chatEl.scrollHeight;
      });
    }
    function isImageUrl(url){
      // 增加宽松度，有些 url 可能后面跟了奇怪的参数
      // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
      // 简单判断：路径部分以图片后缀结尾
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      // 尽量保留原始 URL，但把空格编码，避免 img src 失败
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
      // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      
      // 去除首尾标点
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        // 简单清洗可能混入的结尾
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          // 兼容同一行包含多个 URL 的情况
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      // 去重保序 + 过滤图片链接
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      // 常见“需要看图/见图/如下图”的表述
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      
      // 使用宽松提取
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      
      // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
      // 或者从文本里提取到了图片 URL
      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);
      
      // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
      // 注意：这里做个并集可能更好，防止漏掉
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';

          // 默认隐藏原始 URL 链接：图片成功加载只显示图片（避免每张图下拖一串 URL 文本）；
          // 仅当图片加载失败时才以链接形式兜底显示，便于用户仍能手动打开。
          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = '图片：' + url;
          link.style.display = 'none';

          img.addEventListener('load', () => {
            link.style.display = 'none';
            img.style.display = '';
          });
          img.addEventListener('error', () => {
            img.style.display = 'none';
            link.style.display = 'inline';
          });
          imgWrap.appendChild(img);
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addBotMsgWithTime(text, ts, imageUrls, citations, groundedness, query){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">

        // 历史消息同样渲染引用来源 / 置信度 / 反馈，保证刷新后不丢失
        renderCitationsAndFeedback(el, buildBotMeta(citations, groundedness, sessionId, query));
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">掌柜智库</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>

            <div class="meta">${nowTime()}</div>

        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);

    }

    let __lastProgress = '';
    function renderProgress(botMsgEl, doneList, runningList, status){
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const key = status + '|' + done.join(',') + '|' + running.join(',');
      if (key === __lastProgress) return; // 相同状态短路，避免高频重绘
      __lastProgress = key;

      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

      const lines = [
        ...done.map(x => `✅ ${x}`),
        ...running.map(x => `⏳ ${x}`)
      ];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function buildBotMeta(citations, groundedness, sessionId, query){
      return {
        citations: Array.isArray(citations) ? citations : [],
        groundedness: (typeof groundedness === 'number' && isFinite(groundedness)) ? groundedness : null,
        sessionId: sessionId || '',
        query: query || ''
      };
    }

    async function submitFeedback(msgEl, btnEl, meta, value){
      if(btnEl.dataset.submitted === '1') return;
      btnEl.disabled = true;
      try{
        await App.fetchJson(App.PATHS.feedback, {
          method: 'POST',
          body: JSON.stringify({
            session_id: meta.sessionId,
            query: meta.query,
            cited_chunk_ids: meta.citations.map(c => c && c.faq_id).filter(Boolean),
            thumbs: value
          })
        });
        btnEl.dataset.submitted = '1';
        btnEl.classList.add('active');
        // 置灰另一枚并标注已反馈
        const bar = msgEl.querySelector('.feedback-bar');
        if(bar){
          bar.querySelectorAll('.fb-btn').forEach(b => { if(b !== btnEl) b.disabled = true; });
          const done = bar.querySelector('.fb-done');
          if(done){
            const sofar = String(done.dataset.done || '');
            done.textContent = sofar ? '你已反馈' : '已反馈';
          } else {
            const span = document.createElement('span');
            span.className = 'fb-done';
            span.textContent = '已反馈';
            bar.appendChild(span);
          }
        }
      }catch(err){
        btnEl.disabled = false;
        if(btnEl.dataset.submitted !== '1') showToast('反馈提交失败：' + (err && err.message || err));
      }
    }

    function renderCitationsAndFeedback(msgEl, meta){
      if(!msgEl || !meta) return;
      // 防抖：同一消息只渲染一次
      if(msgEl.querySelector('.cit-wrap')) return;
      const cit = meta.citations || [];
      const g = meta.groundedness;
      // 说明：反馈栏不因“无引用且无置信度”而隐藏——自进化链路把「无法作答/无引用」的回答作为
      // 重要负反馈来源，必须始终提供点赞/点踩入口。引用块、置信度条仍按各自数据条件渲染。

      const wrap = document.createElement('div');
      wrap.className = 'cit-wrap';

      if(cit.length > 0){
        const header = document.createElement('div');
        header.className = 'cit-header';
        header.textContent = `引用来源（${cit.length}）`;
        wrap.appendChild(header);

        const list = document.createElement('div');
        list.className = 'cit-list';
        for(const c of cit){
          const item = document.createElement('div');
          item.className = 'cit-item';
          const tag = document.createElement('span');
          tag.className = 'cit-tag ' + (c.source === 'evolution' ? 'evolution' : 'kb');
          tag.textContent = c.source === 'evolution' ? '自进化' : '知识库';
          item.appendChild(tag);
          const idEl = document.createElement('span');
          idEl.className = 'cit-id';
          idEl.textContent = String(c.faq_id || '').slice(0, 24);
          item.appendChild(idEl);
          list.appendChild(item);
        }
        wrap.appendChild(list);
      }

      if(g !== null){
        const pct = Math.round(g * 100);
        const gz = document.createElement('div');
        gz.className = 'groundedness';
        const gauge = document.createElement('div');
        gauge.className = 'gauge';
        const fill = document.createElement('i');
        fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
        gauge.appendChild(fill);
        gz.appendChild(gauge);
        const label = document.createElement('span');
        label.textContent = '回答置信度 ' + pct + '%';
        gz.appendChild(label);
        wrap.appendChild(gz);
      }

      // 反馈入口
      const bar = document.createElement('div');
      bar.className = 'feedback-bar';
      const up = document.createElement('button');
      up.className = 'fb-btn';
      up.type = 'button';
      up.textContent = '👍 有帮助';
      up.addEventListener('click', () => submitFeedback(msgEl, up, meta, 1));
      const down = document.createElement('button');
      down.className = 'fb-btn';
      down.type = 'button';
      down.textContent = '👎 没帮助';
      down.addEventListener('click', () => submitFeedback(msgEl, down, meta, -1));
      bar.appendChild(up);
      bar.appendChild(down);
      wrap.appendChild(bar);

      // 插到 .meta 之前（注意：.meta 在骨架的内层容器 `div[min-width:180px]` 中，
      // 并非 msgEl 的直接子节点，必须用其父节点调用 insertBefore，否则抛 NotFoundError
      // 且被外层 try/catch 吞掉，导致反馈栏静默不渲染）
      const metaEl = msgEl.querySelector('.meta');
      if(metaEl) metaEl.parentNode.insertBefore(wrap, metaEl);
      else msgEl.appendChild(wrap);
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls, meta){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        // 不把旧进度条重新挂回气泡，避免错误态残留进度栏
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open'); // 完成后自动收起
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      // 引用来源 / 置信度 / 反馈（meta 缺失时自动跳过）
      renderCitationsAndFeedback(botMsgEl, meta);
      if(progressEl) bubble.appendChild(progressEl);
    }

    let __healthFails = 0;
    async function apiHealth(){
      try{
        await App.fetchJson(App.PATHS.health);
        __healthFails = 0;
        apiPill.textContent = `API: 已连接`;
        apiPill.style.cursor = 'default';
      }catch(e){
        __healthFails++;
        apiPill.textContent = __healthFails >= 3 ? `API: 未连接（点此重连）` : `API: 未连接`;
        apiPill.style.cursor = __healthFails >= 3 ? 'pointer' : 'default';
      }
    }
    apiPill.addEventListener('click', () => { if(__healthFails >= 3){ apiHealth(); } });

    async function loadHistory(){
      try{
        const data = await App.fetchJson(App.PATHS.history(sessionId));
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        // 保留首条欢迎消息，其余先清空再渲染历史
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        items.reverse()
        let lastUserQuery = '';
        for(const item of items){
          if(item.role === 'user'){
            lastUserQuery = item.text || '';
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || [],
                              item.citations || [], item.groundedness, lastUserQuery);
          }
        }
        scrollToBottom();
      }catch(err){
        // 不要静默吞掉异常：历史上「反馈按钮不渲染」正是被静默 catch 掩盖的
        console.error('历史加载失败', err);
        showToast('历史加载失败，请稍后重试');
      }
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      return await App.fetchJson(App.PATHS.query, {
        method: 'POST',
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
    }

    async function onSend(){
      if(sendBtn.disabled) return; // 按钮禁用时拦截重复提交（含 Enter 快捷键）
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);
        
        // 渲染初始状态
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          // 非流式：直接拿到结果
          // data: { session_id, answer, done_list, error, message, citations, groundedness }
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || [],
                            buildBotMeta(data.citations, data.groundedness, data.session_id, text));
          sendBtn.disabled = false;
          return;
        }

        // 流式：SSE
        const { session_id } = data; // 此时 backend 返回 session_id
        
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        // SSE 订阅与事件分发统一由公共库处理（事件名：ready/progress/delta/final/close/error）
        App.openStream(session_id, {
          onProgress(d){
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            // 当进度状态已完成时，提前结束“...”等待态，避免后端未发送 final 时按钮一直禁用
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              sendBtn.disabled = false;
            }
          },
          onDelta(d, rawAnswerText){
            // 即使后端未发送 final，也尽可能在流式过程中渲染图片
            renderAnswerWithImages(answerEl, rawAnswerText, []);
            scrollToBottom();
          },
          onFinal(d, rawAnswerText){
            const typing = botMsgEl.querySelector('.typing');
            if(typing) typing.remove();
            const progress = botMsgEl.querySelector('details.progress');
            if(progress) progress.removeAttribute('open');
            // 流式 delta 可能不包含“【图片】/图片列表”，最终包的 answer 才是完整答案，优先使用它
            const hasFinal = d && typeof d.answer === 'string' && d.answer.trim().length > 0;
            const finalText = hasFinal ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, (d && d.image_urls) || []);
            renderCitationsAndFeedback(botMsgEl, buildBotMeta(
              d && d.citations, d && d.groundedness, sessionId, text));
            sendBtn.disabled = false;
          },
          onClose(){
            sendBtn.disabled = false;
          },
          onError(d, rawAnswerText){
            const typing = botMsgEl.querySelector('.typing');
            if(typing) typing.remove();
            const progress = botMsgEl.querySelector('details.progress');
            if(progress) progress.removeAttribute('open');
            const msg = (d && (d.message || d.error)) || 'SSE 连接中断/失败';
            renderAnswerWithImages(answerEl, `${rawAnswerText}\n\n（错误：${msg}）`, []);
            sendBtn.disabled = false;
          }
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      const ok = await App.confirm('确定要清空当前会话的历史记录吗？这将无法恢复。',
                                  { confirmText: '清空', danger: true });
      if(!ok) return;

      try {
        await App.fetchJson(App.PATHS.history(sessionId), { method: 'DELETE' });
      } catch(e) {
        showToast('服务端清空失败，仅清空本地显示');
      }

      // 清空除首条欢迎消息外的内容
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
