<!DOCTYPE html>
<html lang="zh-CN" data-root-path="{{ROOT_PATH}}" data-commerce-enabled="{{COMMERCE_ENABLED}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>知汇 · 在线客服</title>
  <link rel="stylesheet" href="{{ROOT_PATH}}/static/app.css?v={{ASSET_V}}" />
  <link rel="stylesheet" href="{{ROOT_PATH}}/static/chat.css?v={{ASSET_V}}" />
</head>
<body class="support-page">
  <div class="app">
    <header class="support-header">
      <div class="brand">
        <div class="support-mark" aria-hidden="true">知</div>
        <h1>知汇客服</h1>
      </div>
      <div class="top-actions">
        <button type="button" class="service-status" id="apiPill" data-state="connecting" aria-live="polite" disabled>连接中</button>
        <button type="button" class="btn plain" id="btnNew"><span aria-hidden="true">＋</span> 新对话</button>
        <details class="chat-settings">
          <summary class="btn plain">设置</summary>
          <div class="chat-settings-menu">
            <label class="stream-toggle"><input type="checkbox" id="streamToggle" checked> 流式输出</label>
            <a class="btn plain chat-workflow-link" href="{{ROOT_PATH}}/workflows?view=query">流程监控</a>
            <button type="button" class="btn plain" id="btnClear">清空对话</button>
          </div>
        </details>
      </div>
    </header>

    <div class="chat-layout">
      <main class="chat-conversation" aria-label="客服对话">
        <div class="chat" id="chat" role="log" aria-label="对话消息">
          <div class="dayline">对话记录</div>
          <section class="chat-welcome">
            <div class="welcome-mark" aria-hidden="true"><span></span></div>
            <h2>你好，有什么可以帮你？</h2>
            <p id="chatWelcomeHint">可以问产品用法，也可以和我聊聊。</p>
            <div class="chat-shortcuts" role="group" aria-label="快捷问题">
              <button type="button" class="chat-shortcut" data-requires-commerce data-chat-question="查看我的订单">
                <span class="shortcut-icon" data-icon="order" aria-hidden="true"></span>
                <span><strong>查订单</strong><small>查看我的订单</small></span>
              </button>
              <button type="button" class="chat-shortcut" data-requires-commerce data-chat-question="查询商品详情">
                <span class="shortcut-icon" data-icon="product" aria-hidden="true"></span>
                <span><strong>查商品</strong><small>查询商品价格和库存</small></span>
              </button>
              <button type="button" class="chat-shortcut" data-chat-question="如何使用万用表测量电压？">
                <span class="shortcut-icon" data-icon="knowledge" aria-hidden="true"></span>
                <span><strong>问知识库</strong><small>例如如何用万用表测电压</small></span>
              </button>
              <button type="button" class="chat-shortcut" data-chat-question="你好">
                <span class="shortcut-icon" data-icon="chat" aria-hidden="true"></span>
                <span><strong>聊一聊</strong><small>先打个招呼</small></span>
              </button>
            </div>
          </section>
        </div>

        <div class="composer-area">
          <div class="composer-context" id="commerceContext" hidden>
            <span class="composer-context-text" id="commerceContextText" aria-live="polite"></span>
            <button type="button" class="context-action" id="commerceContextDetails">查看详情</button>
            <button type="button" class="context-action context-remove" id="commerceContextRemove" aria-label="移除所选对象">×</button>
          </div>
          <div class="composer">
            <textarea id="input" rows="2" aria-label="对话输入" placeholder="输入问题"></textarea>
            <button type="button" class="send" id="send">发送 <span aria-hidden="true">↑</span></button>
          </div>
          <p class="hint">Enter 发送 <span aria-hidden="true">·</span> Shift + Enter 换行</p>
        </div>
      </main>

      <details id="commerceWorkspace" class="commerce-workspace" hidden open>
        <summary><span>业务对象</span><span class="commerce-workspace-state"></span></summary>
        <div class="commerce-workspace-body">
          <div class="commerce-workspace-actions">
            <button type="button" class="btn plain commerce-reload">刷新</button>
            <button type="button" class="btn plain commerce-logout" hidden>退出商城</button>
          </div>
          <p class="commerce-workspace-status commerce-note" role="status"></p>
          <form class="commerce-target-form commerce-login-form" method="post" hidden>
            <label class="commerce-field">
              商城账号
              <input class="commerce-account-id" name="user_id" autocomplete="username" maxlength="64" required>
            </label>
            <label class="commerce-field">
              密码
              <input class="commerce-account-password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
            </label>
            <button type="submit" class="btn commerce-button commerce-login-submit">登录商城</button>
          </form>
          <div class="commerce-workspace-tasks" aria-live="polite"></div>
          <div class="commerce-workspace-objects"></div>
        </div>
      </details>
    </div>
  </div>

  <script src="{{ROOT_PATH}}/static/app.js?v={{ASSET_V}}"></script>
  <script src="{{ROOT_PATH}}/static/chat-commerce.js?v={{ASSET_V}}"></script>
  <script src="{{ROOT_PATH}}/static/chat.js?v={{ASSET_V}}"></script>
</body>
</html>
