<!-- 客服对话页：普通问答 + 流式输出 + 引用/置信度 + 点赞点踩 + 会话历史。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>掌柜智库知识库</title>
  <link rel="stylesheet" href="/static/app.css?v={{ASSET_V}}" />
  <link rel="stylesheet" href="/static/chat.css?v={{ASSET_V}}" />
</head>
<body>
  <div class="app">
    <div class="topbar attached">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <strong>掌柜智库知识库</strong>
          <span id="subTitle">在线 · 可查询知识库与联网信息</span>
        </div>
      </div>
      <div class="top-actions">
        <label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:var(--muted);">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <span class="pill" id="apiPill">API: 未连接</span>
        <button class="btn" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">掌柜智库</div>
        <div>
          <div class="bubble">你好，我是掌柜智库知识库客服。你可以直接提问，我会在“阶段进度”里展示处理过程。</div>
          <div class="meta">提示：可以问“如何使用万用表测量电压？”</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

  <script src="/static/app.js?v={{ASSET_V}}"></script>
  <script src="/static/chat.js?v={{ASSET_V}}"></script>
</body>
</html>
