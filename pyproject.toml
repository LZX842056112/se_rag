[project]
name = "se_rag"
version = "0.1.0"
description = "企业化 RAG 知识库客服系统（含知识自进化闭环）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "flagembedding>=1.3.5",
    "langchain>=1.2.13",
    "langchain-text-splitters>=0.1.2",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.3",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "numpy>=2.4.3",
    "pymilvus[model]>=2.6.10",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "torch>=2.10.0",
    "uvicorn>=0.42.0",
    "transformers>=4.57.6",
    "openai-agents>=0.4.2",
    "requests>=2.32.5",
]
# 项目下配置环境变量(更推荐)
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 开发/测试依赖（pytest 跑离线单测；mongomock 用于自进化仓储测试）
[dependency-groups]
dev = [
    "pytest>=8.3",
    "mongomock>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认只跑离线用例；真机端到端需显式 `-m e2e`（且需 E2E_ENABLED=1）
addopts = "-m 'not e2e'"
markers = [
    "e2e: 需要真实 Milvus / MongoDB / MinIO / 模型服务的端到端用例（默认跳过）",
]